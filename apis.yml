aid: bullet
name: Bullet
description: >-
  Bullet is Solana's high-performance trading layer — a decentralized exchange offering perpetual
  futures (derivatives), spot, and lending under one unified margin engine. The Bullet Trading API
  is a Binance USD-M Futures (FAPI) compatible REST and WebSocket interface for market data, account
  and position management, and order placement via ed25519-signed transactions, with official Rust
  and WASM/TypeScript SDKs. Bullet runs as a sovereign rollup settling to Solana mainnet-beta, with
  a testnet environment for building and testing against mock assets.
